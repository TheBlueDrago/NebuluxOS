<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0620">
<title>Nebulux OS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='11' fill='%237c5cff'/%3E%3Cellipse cx='24' cy='24' rx='20' ry='7.5' fill='none' stroke='%23ff6fd8' stroke-width='3' transform='rotate(-24 24 24)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/os.css">
</head>
<body>
<div id="boot" hidden><div class="boot-logo"><svg viewBox="0 0 48 48" width="96" height="96" aria-hidden="true"><defs><linearGradient id="bl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6fd8"/><stop offset=".55" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><circle cx="24" cy="24" r="11" fill="url(#bl)"/><ellipse cx="24" cy="24" rx="20" ry="7.5" fill="none" stroke="url(#bl)" stroke-width="3" transform="rotate(-24 24 24)"/><circle cx="41" cy="15" r="3" fill="#fde68a"/></svg><b>Nebulux OS</b></div><span class="spin"></span></div>

<div id="lock" hidden class="locked">
  <div class="lk-bg"></div>
  <div class="lk-clock"><div id="lk-time">12:00</div><div id="lk-date"></div><small class="lk-hint">Click, press a key or swipe up to sign in</small></div>
  <div id="lk-panel" class="lk-panel"></div>
  <div id="lk-users" class="lk-users"></div>
  <div class="lk-corner"><button id="lk-power" aria-label="Power"><svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path d="M24 9v14" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><path d="M15 15a13 13 0 1018 0" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg></button>
    <div id="lk-pmenu" class="lk-pmenu" hidden><button data-pw="restart">Restart</button><button data-pw="off">Shut down</button></div></div>
</div>

<div id="desktop" hidden>
  <div id="icons"></div>
  <div id="windows"></div>
  <div id="snaphint"></div>
  <div id="start" class="flyout" hidden></div>
  <div id="qs" class="flyout" hidden></div>
  <div id="cal" class="flyout" hidden></div>
  <nav id="taskbar" aria-label="Taskbar">
    <div class="tb-center">
      <button id="tb-start" class="tb-btn" aria-label="Start" title="Start"><svg viewBox="0 0 48 48" width="26" height="26" aria-hidden="true"><defs><linearGradient id="sl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6fd8"/><stop offset=".55" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><circle cx="24" cy="24" r="11" fill="url(#sl)"/><ellipse cx="24" cy="24" rx="20" ry="7.5" fill="none" stroke="url(#sl)" stroke-width="3.5" transform="rotate(-24 24 24)"/><circle cx="41" cy="15" r="3" fill="#fde68a"/></svg></button>
      <button id="tb-search" class="tb-btn" aria-label="Search" title="Search"><svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><circle cx="21" cy="21" r="10" fill="none" stroke="currentColor" stroke-width="3.5"/><path d="M29 29l9 9" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg></button>
      <div id="tb-apps"></div>
    </div>
    <div class="tb-right">
      <button id="tb-qs" class="tb-pill" aria-label="Quick settings"><span id="tb-tray"></span></button>
      <button id="tb-clock" class="tb-pill tb-clock" aria-label="Date and time"><span id="tb-time"></span><span id="tb-date"></span></button>
    </div>
  </nav>
</div>

<div id="ctx" class="ctx" hidden></div>
<div id="toasts"></div>
<div id="dim"></div>
<div id="night"></div>
<div id="off" hidden></div>
<noscript><p style="color:#fff;font:16px system-ui;padding:24px">Nebulux OS needs JavaScript turned on.</p></noscript>

<script src="js/store.js"></script>
<script src="js/icons.js"></script>
<script src="js/wallpaper.js"></script>
<script src="js/wm.js"></script>
<script src="js/app-settings.js"></script>
<script src="js/app-google.js"></script>
<script src="js/app-store.js"></script>
<script src="js/app-extra.js"></script>
<script src="js/shell.js"></script>
</body>
</html>
