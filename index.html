<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<style>html,body{background:#0b0620;margin:0}</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0620">
<title>Nebulux OS</title>
<link rel="icon" href="img/nebulux-64.png">
<link rel="stylesheet" href="css/os.css">
</head>
<body>
<div id="boot" hidden><div class="boot-logo"><img src="img/nebulux-256.png" alt="" width="112" height="112"><b>Nebulux OS</b></div><span class="spin"></span></div>

<div id="lock" hidden class="locked">
  <div class="lk-bg"></div>
  <div class="lk-clock"><div id="lk-time">12:00</div><div id="lk-date"></div><small class="lk-hint">Click, press a key or swipe up to sign in</small></div>
  <div id="lk-panel" class="lk-panel"></div>
  <div id="lk-users" class="lk-users"></div>
  <div class="lk-corner"><button id="lk-power" aria-label="Power"><svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path d="M24 9v14" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><path d="M15 15a13 13 0 1018 0" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg></button>
    <div id="lk-pmenu" class="lk-pmenu" hidden><button data-pw="restart">Restart</button><button data-pw="off">Shut down</button></div></div>
</div>

<div id="desktop" hidden>
  <div id="icons"></div>
  <div id="windows"></div>
  <div id="snaphint"></div>
  <div id="start" class="flyout" hidden></div>
  <div id="qs" class="flyout" hidden></div>
  <div id="cal" class="flyout" hidden></div>
  <div id="widgets" class="flyout" hidden></div>
  <div id="snapfly" hidden></div>
  <div id="taskview" hidden></div>
  <nav id="taskbar" aria-label="Taskbar">
    <button id="tb-widgets" class="tb-pill tb-widgets" aria-label="Widgets" title="Widgets"></button>
    <div class="tb-center">
      <button id="tb-start" class="tb-btn" aria-label="Start" title="Start"><img class="tb-neb" src="img/nebulux-64.png" alt="" width="26" height="26"></button>
      <button id="tb-search" class="tb-btn tb-searchbox" aria-label="Search" title="Search"><svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><circle cx="21" cy="21" r="10" fill="none" stroke="currentColor" stroke-width="3.5"/><path d="M29 29l9 9" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg><span>Search</span></button>
      <button id="tb-tview" class="tb-btn" aria-label="Task view" title="Task view"><svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><rect x="7" y="11" width="22" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="3"/><path d="M34 15h4a3 3 0 013 3v15a3 3 0 01-3 3H19a3 3 0 01-3-3v-2" fill="none" stroke="currentColor" stroke-width="3"/></svg></button>
      <div id="tb-apps"></div>
    </div>
    <div class="tb-right">
      <button id="tb-qs" class="tb-pill" aria-label="Quick settings"><span id="tb-tray"></span></button>
      <button id="tb-clock" class="tb-pill tb-clock" aria-label="Date, time and notifications"><span id="tb-time"></span><span id="tb-date"></span><i id="tb-badge" hidden></i></button>
    </div>
  </nav>
</div>

<div id="oobe" hidden></div>
<div id="ctx" class="ctx" hidden></div>
<div id="switcher" hidden></div>
<div id="toasts"></div>
<div id="dim"></div>
<div id="night"></div>
<div id="off" hidden></div>
<noscript><p style="color:#fff;font:16px system-ui;padding:24px">Nebulux OS needs JavaScript turned on.</p></noscript>

<script src="js/store.js"></script>
<script src="js/native.js"></script>
<script src="js/icons.js"></script>
<script src="js/wallpaper.js"></script>
<script src="js/wm.js"></script>
<script src="js/app-settings.js"></script>
<script src="js/app-google.js"></script>
<script src="js/app-store.js"></script>
<script src="js/app-extra.js"></script>
<script src="js/app-webapps.js"></script>
<script src="js/app-files.js"></script>
<script src="js/app-taskmgr.js"></script>
<script src="js/oobe.js"></script>
<script src="js/shell.js"></script>
<script src="js/win11.js"></script>
</body>
</html>
