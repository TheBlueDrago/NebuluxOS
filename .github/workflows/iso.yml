# Builds the bootable Nebulux OS .iso on GitHub's computers, boots it in a virtual computer (BIOS and UEFI) to make
# sure it starts, and puts it in the repo's Releases. Run it from Actions > "Build Nebulux OS" > Run workflow.
name: Build Nebulux OS
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Put the .iso in Releases after it passes the boot test"
        type: boolean
        default: true
  push:
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: iso
  cancel-in-progress: false
jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      NX_VERSION: "1.0"
    steps:
      - uses: actions/checkout@v4

      - name: Check the OS scripts
        run: |
          for f in js/*.js system/helper/*.js system/browser-ext/*.js; do node --check "$f"; done
          for f in system/browser-ext/*.json system/iso/root/etc/chromium/policies/managed/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f'))"; done
          bash -n system/iso/build.sh system/iso/boot-test.sh system/iso/root/usr/local/bin/nebulux-session system/iso/root/etc/skel/.bash_profile
          sh -n system/iso/nebulux.hook.chroot

      - name: Build the .iso
        run: docker run --rm --privileged -e NX_VERSION -v "$PWD":/repo -w /repo debian:bookworm bash system/iso/build.sh

      - name: Boot test in a virtual computer (BIOS and UEFI)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 ovmf socat >/dev/null
          sudo chown -R "$USER" out
          bash system/iso/boot-test.sh out/nebulux-os.iso out/screens

      - name: Save the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-screens
          path: |
            out/screens
            out/build.log
          if-no-files-found: ignore

      - name: Put the .iso in Releases
        if: success() && (startsWith(github.ref, 'refs/tags/') || inputs.release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"; case "$GITHUB_REF" in refs/tags/*) ;; *) TAG="v${NX_VERSION}";; esac
          SIZE=$(du -h out/nebulux-os.iso | cut -f1); SUM=$(cut -d' ' -f1 out/nebulux-os.iso.sha256)
          sed -e "s/@SIZE@/$SIZE/" -e "s/@SHA@/$SUM/" -e "s/@VERSION@/$NX_VERSION/" system/iso/release-notes.md > /tmp/notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/nebulux-os.iso out/nebulux-os.iso.sha256 --clobber
            gh release edit "$TAG" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" out/nebulux-os.iso out/nebulux-os.iso.sha256 --title "Nebulux OS $NX_VERSION" --notes-file /tmp/notes.md --target "$GITHUB_SHA"
          fi
