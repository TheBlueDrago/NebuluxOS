# Builds the bootable Nebulux OS .iso on GitHub's computers, boots it in a virtual computer (BIOS and UEFI) to make
# sure it starts, and puts it in the repo's Releases. Run it from Actions > "Build Nebulux OS" > Run workflow.
name: Build Nebulux OS
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Put the .iso in Releases after it passes the boot test"
        type: boolean
        default: true
      both:
        description: "Boot-test the old BIOS start-up too, not only UEFI (about 4 minutes longer)"
        type: boolean
        default: false
  push:
    tags: ["v*"]
  # the owner's release time for 4.4 (4.2 and everything after it, in one update): Nov 27, 5:30 PM Central (23:30 UTC).
  # Remove this after 4.4 is out.
  schedule:
    - cron: "30 23 27 11 *"
permissions:
  contents: write
concurrency:
  group: iso
  cancel-in-progress: false
jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      NX_VERSION: "4.4"
      # 3.2 has Wi-Fi settings for the system too (NetworkManager, the IdeaPad fix): the new .iso gets all of it
      NX_NEEDS_ISO: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Check the OS scripts
        run: |
          for f in js/*.js system/helper/*.js system/browser-ext/*.js; do node --check "$f"; done
          for f in system/browser-ext/*.json system/iso/root/etc/chromium/policies/managed/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f'))"; done
          bash -n system/iso/build.sh system/iso/boot-test.sh system/iso/root/usr/local/bin/nebulux-session
          sh -n system/iso/nebulux.hook.chroot

      # the Debian packages downloaded last time (saves downloading about 1,500 packages again)
      - name: Reuse downloaded packages
        uses: actions/cache@v4
        with:
          path: .lbcache
          key: lbcache-${{ hashFiles('system/iso/packages.list') }}-${{ github.run_id }}
          restore-keys: |
            lbcache-${{ hashFiles('system/iso/packages.list') }}-
            lbcache-

      - name: Build the .iso
        run: |
          docker run --rm --privileged -e NX_VERSION -v "$PWD":/repo -w /repo debian:bookworm bash system/iso/build.sh
          sudo chown -R "$USER" out .lbcache 2>/dev/null || true

      - name: Boot test in a virtual computer
        env:
          NX_BOOTS: ${{ (inputs.both || startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule') && 'bios uefi' || 'uefi' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 ovmf socat >/dev/null
          sudo chown -R "$USER" out
          bash system/iso/boot-test.sh out/nebulux-os.iso out/screens

      - name: Save the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-screens
          path: |
            out/screens
            out/build.log
          if-no-files-found: ignore

      - name: Put the .iso in Releases
        if: success() && (startsWith(github.ref, 'refs/tags/') || inputs.release || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"; case "$GITHUB_REF" in refs/tags/*) ;; *) TAG="v${NX_VERSION}";; esac
          FILE="Nebulux-OS-$NX_VERSION.iso"
          mv out/nebulux-os.iso "out/$FILE"; ( cd out && sha256sum "$FILE" > "$FILE.sha256" )
          SIZE=$(du -h "out/$FILE" | cut -f1); SUM=$(cut -d' ' -f1 "out/$FILE.sha256")
          # the self-update: computers already on Nebulux OS download just this instead of a new .iso
          bash system/iso/make-update.sh "$NX_VERSION" "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/nebulux-update.tar.gz" out
          sed -e "s/@FILE@/$FILE/g" -e "s/@SIZE@/$SIZE/" -e "s/@SHA@/$SUM/" -e "s/@VERSION@/$NX_VERSION/" system/iso/release-notes.md > /tmp/notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "out/$FILE" "out/$FILE.sha256" out/nebulux-update.tar.gz out/update.json --clobber
            gh release edit "$TAG" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" "out/$FILE" "out/$FILE.sha256" out/nebulux-update.tar.gz out/update.json --title "Nebulux OS $NX_VERSION" --latest --notes-file /tmp/notes.md --target "$GITHUB_SHA"
          fi
