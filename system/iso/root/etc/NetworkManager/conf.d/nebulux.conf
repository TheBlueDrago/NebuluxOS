[main]
plugins=ifupdown,keyfile
[ifupdown]
managed=true
[device]
# Realtek RTW88/RTW89 chips (like the RTL8852BE) miss networks or fail to connect when the address changes while
# scanning, so it stays the chip's own address.
wifi.scan-rand-mac-address=no
[connection]
# Wi-Fi power saving makes Realtek and MediaTek chips drop the connection every few minutes: off (2 = disabled).
wifi.powersave=2
wifi.cloned-mac-address=permanent
ethernet.cloned-mac-address=permanent
