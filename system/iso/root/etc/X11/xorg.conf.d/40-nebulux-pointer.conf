# Nebulux OS: the standard middle pointer speed, and tap-to-click on touchpads.
# The speed can be changed in Settings > Bluetooth & devices > Mouse.
Section "InputClass"
    Identifier "Nebulux mouse"
    MatchIsPointer "on"
    Driver "libinput"
    Option "AccelSpeed" "0"
EndSection

Section "InputClass"
    Identifier "Nebulux touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "on"
    Option "NaturalScrolling" "true"
    Option "AccelSpeed" "0"
EndSection
