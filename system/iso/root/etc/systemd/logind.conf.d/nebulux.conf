# Closing a laptop's lid sleeps it. The power button sleeps it too, like most laptops; Settings > System > Power can
# change that to Shut down or Nothing (written to 90-nebulux-powerkey.conf by nebulux-netfix).
[Login]
HandlePowerKey=suspend
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
