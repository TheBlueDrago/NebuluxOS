# Nebulux OS Wi-Fi settings.
# Realtek RTW89 chips (RTL8852BE, RTL8852AE, RTL8852CE...): their power-saving modes make the connection drop or
# vanish on many laptops (Lenovo IdeaPads among them), so they stay off. Costs very little battery.
options rtw89_pci disable_aspm_l1=y disable_aspm_l1ss=y
options rtw89_core disable_ps_mode=y
# Realtek RTW88 chips (RTL8822CE, RTL8821CE...): the same
options rtw88_pci disable_aspm=y
options rtw88_core disable_lps_deep=y
