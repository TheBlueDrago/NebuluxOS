<!doctype html>
<meta charset="utf-8">
<title>Nebulux OS ad</title>
<body style="margin:0;background:#000">
<canvas id="c" width="1920" height="1080"></canvas>
<script src="mp4-muxer.js"></script>
<script>
// The Nebulux OS ad: 1920x1080, 30 frames a second, drawn frame by frame (the same picture every time), cut to the
// beat of the Nebulux ad's music (130 beats a minute). Nine scenes, real Nebulux OS and website pictures.
"use strict";
const W = 1920, H = 1080, FPS = 30, BEAT = 60 / 130;
const cv = document.getElementById("c"), main = cv.getContext("2d");
let x = main; // the canvas being drawn on (scenes can be drawn off screen for transitions)
const IMG = {};
const load = (k, src) => fetch(src).then((r) => r.blob()).then(createImageBitmap).then((b) => (IMG[k] = b));
const SHOTS = ["lock", "desktop", "start", "search", "desks", "clip", "notes", "tabs", "settings", "store", "quick", "whatsnew", "files", "web-hero", "web-full", "web-download", "web-new", "logo", "wall"];
window.__ready = Promise.all(SHOTS.map((k) => load(k, "shots/" + k + (k === "logo" ? ".png" : ".jpg")))).then(() => document.fonts.ready);

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = (v) => { v = clamp(v); return 1 - Math.pow(1 - v, 3); };
const inout = (v) => { v = clamp(v); return v < .5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2; };
const back = (v) => { v = clamp(v); const c = 1.6; return 1 + (c + 1) * Math.pow(v - 1, 3) + c * Math.pow(v - 1, 2); };
const F = (w, s) => `${w} ${s}px "Segoe UI Variable Display", "Segoe UI", Inter, sans-serif`;
function rr(X, Y, w, h, r) { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); }
function grad(x0, x1) { const g = x.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, "#c4b5fd"); g.addColorStop(.5, "#a78bfa"); g.addColorStop(1, "#f0abfc"); return g; }
function text(s, X, Y, font, fill, align = "center", a = 1) { if (a <= 0) return; x.save(); x.globalAlpha *= a; x.font = font; x.fillStyle = fill; x.textAlign = align; x.textBaseline = "middle"; x.fillText(s, X, Y); x.restore(); }
// a headline: parts [{ s, g }] (g = the gradient word), rising in word by word
function headline(parts, l, Y, size, X = W / 2, align = "center") {
  x.save(); x.font = F(800, size); const sp = size * .28;
  const widths = parts.map((p) => x.measureText(p.s).width), total = widths.reduce((a, b) => a + b, 0) + sp * (parts.length - 1);
  let cx = align === "center" ? X - total / 2 : X;
  parts.forEach((p, i) => { const u = ease((l - i * .09) / .45); if (u > 0) { x.globalAlpha = u; x.fillStyle = p.g ? grad(cx, cx + widths[i]) : "#fff"; x.textAlign = "left"; x.textBaseline = "middle"; x.shadowColor = "rgba(0,0,0,.45)"; x.shadowBlur = 24; x.fillText(p.s, cx, Y + (1 - u) * 40); } cx += widths[i] + sp; });
  x.restore();
}
// seeded stars
const STARS = Array.from({ length: 220 }, (_, i) => { const r = (n) => { const s = Math.sin(i * 12.9898 + n * 78.233) * 43758.5453; return s - Math.floor(s); }; return [r(1) * W, r(2) * H, r(3) * 1.6 + .3, r(4) * 6.28]; });
function bg(t, dim = 1) {
  x.fillStyle = "#05030c"; x.fillRect(0, 0, W, H);
  const blobs = [[.22, .2, .55, "124,92,255", .34], [.82, .25, .45, "192,79,240", .26], [.5, 1.05, .6, "34,195,238", .12], [.65, .7, .35, "124,92,255", .18]];
  for (const [bx, by, br, col, a] of blobs) { const X = (bx + Math.sin(t * .23 + bx * 9) * .04) * W, Y = (by + Math.cos(t * .19 + by * 7) * .04) * H, R = br * W; const g = x.createRadialGradient(X, Y, 0, X, Y, R); g.addColorStop(0, `rgba(${col},${a * dim})`); g.addColorStop(1, "rgba(0,0,0,0)"); x.fillStyle = g; x.fillRect(0, 0, W, H); }
  for (const [sx, sy, sr, ph] of STARS) { x.globalAlpha = (.35 + .65 * (.5 + .5 * Math.sin(t * 2.1 + ph))) * dim; x.fillStyle = "#fff"; x.fillRect(sx, sy, sr, sr); }

}
// a beat punch: 1 right on a beat, fading over a quarter beat
const punch = (t) => { const p = (t / BEAT) % 1; return Math.exp(-p * 7); };
// a framed screen: the picture inside a glowing rounded frame
function screen(img, X, Y, w, h, a = 1, opt = {}) {
  if (!img || a <= 0) return; x.save(); x.globalAlpha *= a;
  x.shadowColor = "rgba(124,92,255,.55)"; x.shadowBlur = 90; rr(X, Y, w, h, 22); x.fillStyle = "#000"; x.fill();
  x.shadowColor = "transparent"; x.save(); rr(X, Y, w, h, 22); x.clip();
  const sx = opt.sx || 0, sy = opt.sy || 0, sw = opt.sw || img.width, sh = opt.sh || img.height;
  x.drawImage(img, sx, sy, sw, sh, X, Y, w, h); x.restore();
  x.strokeStyle = "rgba(255,255,255,.18)"; x.lineWidth = 2; rr(X, Y, w, h, 22); x.stroke(); x.restore();

// a picture zoomed into: scale z around a point (fx, fy) of the frame, as fractions
function zoomed(img, X, Y, w, h, z, fx, fy, a = 1) { const sw = img.width / z, sh = img.height / z; screen(img, X, Y, w, h, a, { sx: clamp(fx * img.width - sw / 2, 0, img.width - sw), sy: clamp(fy * img.height - sh / 2, 0, img.height - sh), sw, sh }); }
// a pill label
function chip(s, X, Y, a, size = 30, fill = "rgba(255,255,255,.1)", col = "#fff", align = "left") {

  rr(X0, Y - h / 2, w, h, h / 2); x.fillStyle = fill; x.fill(); x.strokeStyle = "rgba(255,255,255,.16)"; x.lineWidth = 1.5; x.stroke();
  x.fillStyle = col; x.textAlign = "left"; x.textBaseline = "middle"; x.fillText(s, X0 + size * .7, Y + 1); x.restore();
}
function kicker(s, X, Y, a, align = "left") { text(s.toUpperCase().split("").join(String.fromCharCode(8202)), X, Y, F(800, 24), "#b9a6ff", align, a); }
// the Nebulux logo with its glow
function logo(X, Y, r, a = 1, glow = 1) {

// orbit rings around a point, like the Nebulux wallpaper
function rings(X, Y, t, a) {
  if (a <= 0) return; x.save(); x.translate(X, Y); x.rotate(-.42 + Math.sin(t * .3) * .03); x.globalAlpha = a;
  [[560, 150, 9, .55], [470, 122, 7, .45], [385, 98, 5, .35]].forEach(([rx, ry, lw, al], i) => { const g = x.createLinearGradient(-rx, 0, rx, 0); g.addColorStop(0, `rgba(167,139,250,${al})`); g.addColorStop(.5, `rgba(240,171,252,${al + .15})`); g.addColorStop(1, `rgba(124,92,255,${al})`); x.strokeStyle = g; x.lineWidth = lw; x.beginPath(); x.ellipse(0, 0, rx * (1 + i * 0), ry, 0, 0, 7); x.stroke(); });
  x.restore();
}
// a browser window around a picture of the website
function browser(img, X, Y, w, h, scrollY, a = 1) {
  if (a <= 0) return; x.save(); x.globalAlpha *= a; const bar = 64;
  x.shadowColor = "rgba(124,92,255,.5)"; x.shadowBlur = 90; rr(X, Y, w, h + bar, 20); x.fillStyle = "#16112a"; x.fill(); x.shadowColor = "transparent";
  ["#ff5f57", "#febc2e", "#28c840"].forEach((c, i) => { x.fillStyle = c; x.beginPath(); x.arc(X + 32 + i * 26, Y + bar / 2, 8, 0, 7); x.fill(); });
  rr(X + 130, Y + 14, w - 260, bar - 28, 18); x.fillStyle = "rgba(255,255,255,.08)"; x.fill();
  text("nebuluxos.thebluedragonstriker.workers.dev", X + 160, Y + bar / 2 + 1, F(600, 22), "#e9e4ff", "left");
  x.save(); rr(X, Y + bar, w, h, 0); x.clip(); const k = w / img.width; x.drawImage(img, 0, scrollY / k, img.width, h / k, X, Y + bar, w, h); x.restore();
  x.strokeStyle = "rgba(255,255,255,.16)"; x.lineWidth = 2; rr(X, Y, w, h + bar, 20); x.stroke(); x.restore();
}
function cursor(X, Y, down) { x.save(); x.translate(X, Y); x.scale(down ? .9 : 1, down ? .9 : 1); x.fillStyle = "#fff"; x.strokeStyle = "#000"; x.lineWidth = 2.5; x.beginPath(); x.moveTo(0, 0); x.lineTo(0, 46); x.lineTo(12, 35); x.lineTo(21, 54); x.lineTo(29, 50); x.lineTo(20, 32); x.lineTo(36, 32); x.closePath(); x.fill(); x.stroke(); x.restore(); }

// ---------- the scenes (l = seconds into the scene, d = its length) ----------
// 1. The name: the logo arrives, the rings, "Nebulux OS"
function sIntro(l, d, t) {
  bg(t, .9 + .1 * punch(t));
  const u = back((l - .15) / .9), r = 120 * u * (1 + .04 * punch(t));
  rings(W / 2, 440, t, ease((l - .5) / 1.2) * .9);
  logo(W / 2, 440, r, ease(l / .4), 1 + .6 * punch(t));
  x.save(); x.font = F(900, 150); const ws = "Nebulux OS".split(""); let tw = 0; ws.forEach((c) => (tw += x.measureText(c).width)); let cx = W / 2 - tw / 2;
  ws.forEach((c, i) => { const v = ease((l - 1.4 - i * .05) / .5); const cw = x.measureText(c).width; if (v > 0) { x.globalAlpha = v; x.fillStyle = grad(W / 2 - tw / 2, W / 2 + tw / 2); x.textAlign = "left"; x.textBaseline = "middle"; x.shadowColor = "rgba(124,92,255,.6)"; x.shadowBlur = 40; x.fillText(c, cx, 720 + (1 - v) * 60); } cx += cw; });
  x.restore();
  text("A whole computer on a USB stick.", W / 2, 840, F(600, 46), "#d9d0ff", "center", ease((l - 2.5) / .6));
  // the last half beat: everything rushes toward you into the flash
  if (l > d - .5) { const v = (l - (d - .5)) / .5; x.fillStyle = `rgba(255,255,255,${v * v * .9})`; x.fillRect(0, 0, W, H); }
}
// 2. Signing in: the lock screen lifts away to show the desktop
function sDesktop(l, d, t) {
  bg(t, .7);
  const fw = 1560, fh = 975, X = (W - fw) / 2, Y = 36, z = 1 + .03 * (l / d);
  x.save(); x.translate(W / 2, Y + fh / 2); x.scale(z, z); x.translate(-W / 2, -(Y + fh / 2));
  const lift = inout((l - 1.5) / .7);
  screen(IMG.desktop, X, Y, fw, fh);
  if (lift < 1) { x.save(); rr(X, Y, fw, fh, 22); x.clip(); x.drawImage(IMG.lock, X, Y - lift * fh, fw, fh); x.restore(); }
  x.restore();
  // the caption on a dark strip at the bottom
  const a = ease((l - 2.2) / .5) * (1 - ease((l - (d - .25)) / .25));
  if (a > 0) { x.save(); x.globalAlpha = a; const g = x.createLinearGradient(0, H - 330, 0, H); g.addColorStop(0, "rgba(5,3,12,0)"); g.addColorStop(1, "rgba(5,3,12,.92)"); x.fillStyle = g; x.fillRect(0, H - 330, W, 330); x.restore(); }
  headline([{ s: "Your desktop." }, { s: "On any PC.", g: true }], l - 2.2, 905, 96);
  text("Plug in the USB, start up, sign in.", W / 2, 1000, F(600, 36), "#d9d0ff", "center", ease((l - 2.6) / .5));
}
// 3. Start and search
function sStart(l, d, t) {
  bg(t, .7);
  const fw = 1400, fh = 875, X = 90, Y = (H - fh) / 2;
  const s1 = ease(l / .45), sw = inout((l - 2.1) / .5);
  screen(IMG.desktop, X, Y, fw, fh, 1 - s1);
  if (sw < 1) zoomed(IMG.start, X, Y, fw, fh, 1 + .02 * s1, .5, .55, s1 * (1 - sw));
  if (sw > 0) zoomed(IMG.search, X, Y, fw, fh, 1 + .25 * inout((l - 2.4) / 1.6), .52, .4, sw);
  kicker("Start and search", 1560, 360, ease((l - .3) / .4));
  x.save(); x.font = F(800, 76); ["Find", "anything."].forEach((s, i) => { const v = ease((l - .45 - i * .12) / .45); x.globalAlpha = v; x.fillStyle = i ? grad(1560, 1860) : "#fff"; x.textAlign = "left"; x.textBaseline = "middle"; x.fillText(s, 1560, 450 + i * 88 + (1 - v) * 30); }); x.restore();
  ["Apps, settings and", "files in one search.", "Pin it to the taskbar."].forEach((s, i) => text(s, 1560, 650 + i * 46, F(600, 32), "#d9d0ff", "left", ease((l - 1 - i * .15) / .5)));
}
// 4. New in 3.2: a quick picture on every second beat
const MONTAGE = [["desks", "Virtual desktops", .5, .78], ["clip", "Clipboard history", .86, .72], ["notes", "Sticky Notes", .45, .38], ["tabs", "Tabs in File Explorer", .35, .18], ["settings", "Settings that make sense", .45, .4], ["store", "Real apps from the Store", .5, .45]];
function sMontage(l, d, t) {
  bg(t, .8 + .2 * punch(t));
  const each = BEAT * 2, i = Math.min(MONTAGE.length - 1, Math.floor(l / each)), li = l - i * each, [k, label, fx, fy] = MONTAGE[i];
  const fw = 1500, fh = 937, X = (W - fw) / 2, Y = 40, dir = i % 2 ? -1 : 1;
  const inn = ease(li / .22), off = (1 - inn) * W * .9 * dir, z = 1.04 + .1 * ease(li / each) + .015 * punch(t);
  // the previous picture leaving the other way, with a blur streak
  if (i > 0 && li < .22) { const [pk, , pfx, pfy] = MONTAGE[i - 1]; x.save(); x.translate(-inn * W * .9 * dir, 0); for (let s = 0; s < 3; s++) zoomed(IMG[pk], X - dir * s * 40, Y, fw, fh, 1.14, pfx, pfy, (1 - inn) * (.6 - s * .18)); x.restore(); }
  x.save(); x.translate(off, 0); for (let s = (li < .22 ? 2 : 0); s >= 0; s--) zoomed(IMG[k], X + dir * s * 50 * (1 - inn), Y, fw, fh, z, fx, fy, s ? .25 * (1 - inn) : 1); x.restore();
  // the label
  const la = ease((li - .12) / .25);
  if (i < 4) chip("New in 3.2", 150, 840, la, 26, "rgba(124,92,255,.85)");
  chip(label, 150, 925, la, 50, "rgba(10,6,24,.82)");
}
// 5. Built for laptops: quick settings, and what works
const LAPTOP = ["Wi-Fi 6 and 6E drivers", "School and work Wi-Fi", "Mobile hotspot", "Battery saver", "Volume and brightness keys", "Sleep when you close the lid"];
function sLaptop(l, d, t) {
  bg(t, .75);
  const fw = 1120, fh = 700, X = 90, Y = (H - fh) / 2;
  zoomed(IMG.quick, X, Y, fw, fh, 1 + 1.1 * inout(l / d), .86, .7, ease(l / .3));
  kicker("Built for laptops", 1300, 250, ease((l - .1) / .4));
  headline([{ s: "Everything" }], l - .15, 320, 70, 1300, "left");
  headline([{ s: "just works.", g: true }], l - .25, 400, 70, 1300, "left");
  LAPTOP.forEach((s, i) => chip(s, 1300, 500 + i * 86, ease((l - .45 - i * BEAT / 2) / .3), 30));
}
// 6. It updates itself
function sUpdates(l, d, t) {
  bg(t, .75);
  const fw = 1240, fh = 775, X = (W - fw) / 2, rise = ease(l / .6), Y = 300 + (1 - rise) * 200;
  zoomed(IMG.whatsnew, X, Y, fw, fh, 1.25, .5, .3, rise);
  headline([{ s: "It" }, { s: "updates itself.", g: true }], l - .2, 130, 92);
  ["Later", "Remind me", "Never"].forEach((s, i) => chip(s, W / 2 + (i - 1) * 260, 236, ease((l - .8 - i * BEAT) / .3), 30, i === 0 ? "rgba(124,92,255,.9)" : "rgba(255,255,255,.12)", "#fff", "center"));
}
// 7. Nebulux OS and Windows 11 side by side
const ROWS = [["Price", "Free", "Paid license"], ["Older computers", "PCs from about 2010 on", "Needs TPM 2.0"], ["Try it first", "Runs from a USB", "Installs on your drive"], ["Your current system", "Never touched", "Replaced or changed"], ["Ads and suggestions", "None, ever", "Suggested apps"], ["Updates", "You choose when", "Pause for a few weeks"]];
function sCompare(l, d, t) {
  bg(t, .8);
  headline([{ s: "Everything you like about a PC." }], l - .1, 120, 64);
  headline([{ s: "None of the catches.", g: true }], l - .4, 205, 64);
  const X = 260, w = 1400, rowH = 104, Y0 = 300;
  const ta = ease((l - .5) / .4); x.save(); x.globalAlpha = ta; rr(X, Y0, w, rowH * (ROWS.length + 1), 26); x.fillStyle = "rgba(255,255,255,.05)"; x.fill(); x.strokeStyle = "rgba(255,255,255,.12)"; x.lineWidth = 2; x.stroke();
  x.save(); rr(X, Y0, w, rowH * (ROWS.length + 1), 26); x.clip(); const g = x.createLinearGradient(X + 420, 0, X + 920, 0); g.addColorStop(0, "rgba(124,92,255,.32)"); g.addColorStop(1, "rgba(192,79,240,.18)"); x.fillStyle = g; x.fillRect(X + 420, Y0, 500, rowH * (ROWS.length + 1)); x.restore(); x.restore();
  logo(X + 470, Y0 + rowH / 2, 22, ta, .4); text("Nebulux OS", X + 506, Y0 + rowH / 2, F(800, 34), "#fff", "left", ta); text("Windows 11", X + 960, Y0 + rowH / 2, F(700, 34), "#b9b0dc", "left", ta);
  ROWS.forEach(([k, a, b], i) => {
    const v = ease((l - .9 - i * BEAT * .75) / .3), Y = Y0 + rowH * (i + 1.5); if (v <= 0) return;
    x.save(); x.globalAlpha = v; x.fillStyle = "rgba(255,255,255,.1)"; x.fillRect(X + 24, Y - rowH / 2, w - 48, 1.5); x.restore();
    text(k, X + 40, Y, F(600, 30), "#b9b0dc", "left", v);
    x.save(); x.globalAlpha = v; x.strokeStyle = "#3ddc84"; x.lineWidth = 6; x.lineCap = "round"; x.lineJoin = "round"; x.beginPath(); x.moveTo(X + 452, Y); x.lineTo(X + 466, Y + 14); x.lineTo(X + 492, Y - 14); x.stroke(); x.restore();
    text(a, X + 512, Y, F(700, 32), "#fff", "left", v); text(b, X + 960, Y, F(500, 30), "#8a82ad", "left", v);
  });
  text("Windows and Windows 11 are trademarks of Microsoft Corporation. Nebulux OS is made by Nebulux LLC and isn't affiliated with Microsoft.", W / 2, 1040, F(500, 19), "#6f6894", "center", ta);
}
// 8. The website: it scrolls down to the features
function sWebsite(l, d, t) {
  bg(t, .7);
  const fw = 1500, fh = 820, X = (W - fw) / 2, Y = 150, img = IMG["web-full"], k = fw / img.width;

// 9. Download: the cursor presses Download right on the boom, then the end card
const BOOM = BEAT * 1.5;
function sFinale(l, d, t) {
  const f = clamp((l - BOOM) / .35);
  if (l < BOOM + .35) {
    bg(t, .7);
    const fw = 1500, fh = 820, X = (W - fw) / 2, Y = 150, img = IMG["web-download"], zz = 1 + .05 * ease(l / BOOM), kk = fw / img.width;
    headline([{ s: "Get it from the" }, { s: "Nebulux OS website.", g: true }], 9, 82, 58);
    x.save(); x.translate(W / 2, Y + fh / 2); x.scale(zz, zz); x.translate(-W / 2, -(Y + fh / 2));

    // the Download button in the picture is at (1521, 506) of 1920x1080

    x.restore();
  }

  if (l >= BOOM - .02 && l < BOOM + .6) { const v = 1 - (l - BOOM) / .6; x.fillStyle = `rgba(255,255,255,${clamp(v) * .75})`; x.fillRect(0, 0, W, H); }
  if (l > d - .7) { x.fillStyle = `rgba(0,0,0,${ease((l - (d - .7)) / .7)})`; x.fillRect(0, 0, W, H); }
}
const SPARKS = Array.from({ length: 90 }, (_, i) => { const r = (n) => { const s = Math.sin(i * 91.17 + n * 13.7) * 9137.3; return s - Math.floor(s); }; return [r(1) * 6.28, 300 + r(2) * 900, 2 + r(3) * 5, r(4)]; });
function endCard(l, d, t, a) {
  x.save(); x.globalAlpha = a;
  bg(t, 1);

  text("© 2026 Nebulux LLC", W / 2, 1030, F(500, 22), "#7d76a3", "center", ease((l - 1.5) / .5));

}

// ---------- the timeline (the same cut points as the Nebulux ad's music) ----------
const SCENES = [[sIntro, 10], [sDesktop, 12], [sStart, 10], [sMontage, 12], [sLaptop, 8], [sUpdates, 8], [sCompare, 12], [sWebsite, 6], [sFinale, 22]].map(([f, b]) => [f, b * BEAT]);
// the cuts: how each scene comes in
const TRANS = [null, "flash", "zoom", "whip", "sweep", "rise", "zoom", "whip", null];
window.__LEN = 46.6; SCENES[SCENES.length - 1][1] += window.__LEN - SCENES.reduce((a, s) => a + s[1], 0); // the end card holds to the end of the music
const STARTS = []; { let a = 0; for (const s of SCENES) { STARTS.push(a); a += s[1]; } }
const off = [document.createElement("canvas"), document.createElement("canvas")]; off.forEach((c) => { c.width = W; c.height = H; });
function scene(i, l, t, on) { const prev = x; x = on; x.save(); x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; SCENES[i][0](l, SCENES[i][1], t); x.restore(); x = prev; }

    main.save(); main.fillStyle = "#000"; main.fillRect(0, 0, W, H);
    if (tr === "flash" || tr === "fade") { main.globalAlpha = 1; main.drawImage(off[1], 0, 0); if (tr === "flash") { main.fillStyle = `rgba(255,255,255,${(1 - p) * .9})`; main.fillRect(0, 0, W, H); } else { main.globalAlpha = 1 - p; main.drawImage(off[0], 0, 0); } }

    main.restore();
  } else scene(i, l, t, main);
  if (t < .3) { main.fillStyle = `rgba(0,0,0,${1 - t / .3})`; main.fillRect(0, 0, W, H); }
};
window.__still = (t) => { window.__frame(t); return cv.toDataURL("image/jpeg", .82); };

// ---------- making the MP4: every frame through the H.264 encoder, the music through AAC ----------
window.__render = async (musicURL, upTo) => {
