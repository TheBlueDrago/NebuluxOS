<!doctype html>
<meta charset="utf-8">
<title>Nebulux OS ad</title>
<body style="margin:0;background:#000">
<canvas id="c" width="1920" height="1080"></canvas>
<script src="mp4-muxer.js"></script>
<script>
// The Nebulux OS ad: 1920x1080, 30 frames a second, drawn frame by frame (the same picture every time), cut to the
// beat of the Nebulux ad's music (130 beats a minute).
// A splash to open (no logo), the desktop, the highlights with a spotlight on each one, laptops, updates, the
// comparison, the website, a click on Download right on the boom, and the logo splash with the end card.
"use strict";
const W = 1920, H = 1080, FPS = 30, BEAT = 60 / 130;
const cv = document.getElementById("c"), main = cv.getContext("2d");
let x = main; // the canvas being drawn on (scenes are drawn off screen for transitions)
const IMG = {};
const load = (k, src) => fetch(src).then((r) => r.blob()).then(createImageBitmap).then((b) => (IMG[k] = b));
const stopsP = fetch("shots/web-stops.json").then((r) => r.json()).then((s) => (window.STOPS = s)).catch(() => {});
const SHOTS = ["lock", "desktop", "start", "search", "desks", "clip", "notes", "tabs", "settings", "store", "quick", "whatsnew", "web-full", "web-download", "logo-big", "wall"];
window.__ready = Promise.all([stopsP].concat(SHOTS.map((k) => load(k, "shots/" + k + (k === "logo-big" ? ".png" : ".jpg"))))).then(() => document.fonts.ready);

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = (v) => { v = clamp(v); return 1 - Math.pow(1 - v, 3); };
const inout = (v) => { v = clamp(v); return v < .5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2; };
const back = (v) => { v = clamp(v); const c = 1.5; return 1 + (c + 1) * Math.pow(v - 1, 3) + c * Math.pow(v - 1, 2); };
const F = (w, s) => `${w} ${s}px "Segoe UI Variable Display", "Segoe UI", Inter, sans-serif`;

function text(s, X, Y, font, fill, align = "center", a = 1) { if (a <= 0) return; x.save(); x.globalAlpha *= a; x.font = font; x.fillStyle = fill; x.textAlign = align; x.textBaseline = "middle"; x.fillText(s, X, Y); x.restore(); }
// a headline: parts [{ s, g }] (g = the gradient word), rising in word by word

  x.save(); const base = x.globalAlpha; x.font = F(800, size); const sp = size * .28;
  const widths = parts.map((p) => x.measureText(p.s).width), total = widths.reduce((a, b) => a + b, 0) + sp * (parts.length - 1);
  let cx = align === "center" ? X - total / 2 : X;
  parts.forEach((p, i) => { const u = ease((l - i * .08) / .4); if (u > 0) { x.globalAlpha = base * u; x.fillStyle = p.g ? grad(cx, cx + widths[i]) : "#fff"; x.textAlign = "left"; x.textBaseline = "middle"; x.shadowColor = "rgba(0,0,0,.45)"; x.shadowBlur = 24; x.fillText(p.s, cx, Y + (1 - u) * 36); } cx += widths[i] + sp; });
  x.restore();
}
const STARS = Array.from({ length: 220 }, (_, i) => { const r = (n) => { const s = Math.sin(i * 12.9898 + n * 78.233) * 43758.5453; return s - Math.floor(s); }; return [r(1) * W, r(2) * H, r(3) * 1.6 + .3, r(4) * 6.28]; });
function bg(t, dim = 1) {

  const blobs = [[.22, .2, .55, "124,92,255", .34], [.82, .25, .45, "192,79,240", .26], [.5, 1.05, .6, "34,195,238", .12], [.65, .7, .35, "124,92,255", .18]];
  for (const [bx, by, br, col, a] of blobs) { const X = (bx + Math.sin(t * .23 + bx * 9) * .04) * W, Y = (by + Math.cos(t * .19 + by * 7) * .04) * H, R = br * W; const g = x.createRadialGradient(X, Y, 0, X, Y, R); g.addColorStop(0, `rgba(${col},${a * dim})`); g.addColorStop(1, "rgba(0,0,0,0)"); x.fillStyle = g; x.fillRect(0, 0, W, H); }
  for (const [sx, sy, sr, ph] of STARS) { x.globalAlpha = (.35 + .65 * (.5 + .5 * Math.sin(t * 2.1 + ph))) * dim; x.fillStyle = "#fff"; x.fillRect(sx, sy, sr, sr); }

const punch = (t) => { const p = (t / BEAT) % 1; return Math.exp(-p * 7); };
// a framed screen: the picture inside a glowing rounded frame
function screen(img, X, Y, w, h, a = 1, opt = {}) {
  if (!img || a <= 0) return; x.save(); x.globalAlpha *= a;
  x.shadowColor = "rgba(124,92,255,.5)"; x.shadowBlur = 80; rr(X, Y, w, h, 22); x.fillStyle = "#000"; x.fill();
  x.shadowColor = "transparent"; x.save(); rr(X, Y, w, h, 22); x.clip();
  x.drawImage(img, opt.sx || 0, opt.sy || 0, opt.sw || img.width, opt.sh || img.height, X, Y, w, h); x.restore();
  x.strokeStyle = "rgba(255,255,255,.18)"; x.lineWidth = 2; rr(X, Y, w, h, 22); x.stroke(); x.restore();
}
// a picture zoomed in by z around (fx, fy), as fractions; returns how to find a point of the picture in the frame
function zoomed(img, X, Y, w, h, z, fx, fy, a = 1) {
  const sw = img.width / z, sh = img.height / z, sx = clamp(fx * img.width - sw / 2, 0, img.width - sw), sy = clamp(fy * img.height - sh / 2, 0, img.height - sh);

// the spotlight: everything darker except one part, with a glowing outline around it

  rr(X0, Y - h / 2, w, h, h / 2); x.fillStyle = fill; x.fill(); x.strokeStyle = "rgba(255,255,255,.16)"; x.lineWidth = 1.5; x.stroke();
  x.fillStyle = col; x.textAlign = "left"; x.textBaseline = "middle"; x.fillText(s, X0 + size * .7, Y + 1); x.restore();
}
function kicker(s, X, Y, a, align = "left") { text(s.toUpperCase().split("").join(String.fromCharCode(8202)), X, Y, F(800, 24), "#b9a6ff", align, a); }
// the Nebulux logo, as it is: the square nebula picture with rounded corners, and a soft glow
function logo(X, Y, size, a = 1, glow = 1) {

  const g = x.createRadialGradient(X, Y, s * .2, X, Y, s * 1.4); g.addColorStop(0, `rgba(192,132,252,${.5 * glow})`); g.addColorStop(1, "rgba(192,132,252,0)"); x.fillStyle = g; x.fillRect(X - s * 1.5, Y - s * 1.5, s * 3, s * 3);
  x.shadowColor = "rgba(0,0,0,.5)"; x.shadowBlur = 40; rr(X - s / 2, Y - s / 2, s, s, r); x.fillStyle = "#000"; x.fill(); x.shadowColor = "transparent";
  x.save(); rr(X - s / 2, Y - s / 2, s, s, r); x.clip(); x.drawImage(img, X - s / 2, Y - s / 2, s, s); x.restore();
  x.strokeStyle = "rgba(255,255,255,.22)"; x.lineWidth = 2; rr(X - s / 2, Y - s / 2, s, s, r); x.stroke(); x.restore();
}
function browser(img, X, Y, w, h, scrollY, a = 1) {
  if (a <= 0) return; x.save(); x.globalAlpha *= a; const bar = 64;
  x.shadowColor = "rgba(124,92,255,.5)"; x.shadowBlur = 80; rr(X, Y, w, h + bar, 20); x.fillStyle = "#16112a"; x.fill(); x.shadowColor = "transparent";
  ["#ff5f57", "#febc2e", "#28c840"].forEach((c, i) => { x.fillStyle = c; x.beginPath(); x.arc(X + 32 + i * 26, Y + bar / 2, 8, 0, 7); x.fill(); });
  rr(X + 130, Y + 14, w - 260, bar - 28, 18); x.fillStyle = "rgba(255,255,255,.08)"; x.fill();
  text("nebuluxos.thebluedragonstriker.workers.dev", X + 160, Y + bar / 2 + 1, F(600, 22), "#e9e4ff", "left");
  x.save(); rr(X, Y + bar, w, h, 0); x.clip(); const k = w / img.width; x.drawImage(img, 0, scrollY / k, img.width, h / k, X, Y + bar, w, h); x.restore();
  x.strokeStyle = "rgba(255,255,255,.16)"; x.lineWidth = 2; rr(X, Y, w, h + bar, 20); x.stroke(); x.restore();
}
function cursor(X, Y, down) { x.save(); x.translate(X, Y); x.scale(down ? .9 : 1, down ? .9 : 1); x.fillStyle = "#fff"; x.strokeStyle = "#000"; x.lineWidth = 2.5; x.beginPath(); x.moveTo(0, 0); x.lineTo(0, 46); x.lineTo(12, 35); x.lineTo(21, 54); x.lineTo(29, 50); x.lineTo(20, 32); x.lineTo(36, 32); x.closePath(); x.fill(); x.stroke(); x.restore(); }
// the bottom caption strip used by the highlight scenes
function captionStrip(a) { if (a <= 0) return; x.save(); x.globalAlpha = a; const g = x.createLinearGradient(0, H - 340, 0, H); g.addColorStop(0, "rgba(5,3,12,0)"); g.addColorStop(1, "rgba(5,3,12,.94)"); x.fillStyle = g; x.fillRect(0, H - 340, W, 340); x.restore(); }

// ---------- the scenes (l = seconds into the scene, d = its length, t = seconds into the ad) ----------
// 1. The opening splash: a line of light, then the words land on the beat
// The opening splash, like every Nebulux ad: the product's own homepage hero, with the last words changing on the beat,
// then a question on its own before the drop
const OPEN_WORDS = ["runs from a USB", "costs nothing", "updates itself", "just works"];
function pill(s, X, Y, size, fill, col, a = 1, stroke) {
  if (a <= 0) return 0; x.save(); x.globalAlpha *= a; x.font = F(800, size); const w = x.measureText(s).width + size * 1.6, h = size * 2.1;
  rr(X - w / 2, Y - h / 2, w, h, h / 2); x.fillStyle = fill; x.fill(); if (stroke) { x.strokeStyle = stroke; x.lineWidth = 2; x.stroke(); }
  x.fillStyle = col; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(s, X, Y + 1); x.restore(); return w;
}
function sOpen(l, d, t) {
  const b = l / BEAT, Q = 7.4; // the question comes in on beat 7.4
  if (b < Q) {
    bg(t, 1);
    // "new" pill at the top, like the website
    const pa = ease(l / .4); if (pa > 0) { x.save(); x.globalAlpha = pa; x.font = F(700, 24); const s1 = "New: Nebulux OS 3.2.2", w1 = x.measureText(s1).width, w = w1 + 150; rr(W / 2 - w / 2, 156, w, 52, 26); x.fillStyle = "rgba(255,255,255,.07)"; x.fill(); x.strokeStyle = "rgba(255,255,255,.14)"; x.lineWidth = 1.5; x.stroke(); rr(W / 2 + w / 2 - 104, 164, 88, 36, 18); x.fillStyle = "#22c55e"; x.fill(); text("FREE", W / 2 + w / 2 - 60, 183, F(900, 20), "#04210f"); text(s1, W / 2 - w / 2 + 28, 183, F(700, 24), "#e9e4ff", "left"); x.restore(); }
    // "Meet Nebulux OS." brightens from gray to white, the way the other ads' heroes do
    const m = ease(l / .5), wh = Math.round(150 + 105 * ease((l - .2) / .6));
    text("Meet Nebulux OS.", W / 2, 350 + (1 - m) * 30, F(900, 150), `rgb(${wh},${wh},${wh})`, "center", m);
    text("A whole computer that", W / 2, 505, F(800, 92), "#c4b5fd", "center", ease((l - .35) / .4));
    // the changing words: one every two beats, sliding up

    text("Plug in the USB, start up, and it's yours. Free, private, and fast on any PC.", W / 2, 750, F(600, 34), "#b9b0dc", "center", ease((l - .9) / .4));
    const ba = ease((l - 1.2) / .4); pill("Download free  →", W / 2 - 200, 860, 30, "#fff", "#1d1040", ba); pill("Try it in your browser", W / 2 + 230, 860, 30, "rgba(255,255,255,.1)", "#fff", ba, "rgba(255,255,255,.18)");
  } else {

  }

// 2. Signing in: the lock screen lifts away to show the desktop
function sDesktop(l, d, t) {
  bg(t, .7);
  const fw = 1560, fh = 975, X = (W - fw) / 2, Y = 36, z = 1 + .03 * (l / d);
  x.save(); x.translate(W / 2, Y + fh / 2); x.scale(z, z); x.translate(-W / 2, -(Y + fh / 2));
  const lift = inout((l - 1.3) / .7);

  if (lift < 1) { x.save(); rr(X, Y, fw, fh, 22); x.clip(); x.drawImage(IMG.lock, X, Y - lift * fh, fw, fh); x.restore(); }
  x.restore();
  captionStrip(ease((l - 2) / .5));
  headline([{ s: "Your desktop." }, { s: "On any PC.", g: true }], l - 2, 905, 96);
  text("Plug in the USB, start up, sign in. Your computer's own drive is never touched.", W / 2, 1000, F(600, 34), "#d9d0ff", "center", ease((l - 2.4) / .5));
}
// 3. Start and search, with the spotlight on Pin to taskbar
function sSearch(l, d, t) {
  bg(t, .7);
  const fw = 1400, fh = 875, X = 80, Y = (H - fh) / 2, sw = inout((l - 1.6) / .45), z = 1 + .45 * inout((l - 2) / 1.4);
  if (sw < 1) zoomed(IMG.start, X, Y, fw, fh, 1, .5, .5, 1 - sw);
  if (sw > 0) { const at = zoomed(IMG.search, X, Y, fw, fh, z, .6, .42, sw); const [a0, b0] = at(.543, .434), [a1, b1] = at(.698, .484); spotlight(a0, b0, a1 - a0, b1 - b0, ease((l - 2.7) / .4), [X, Y, fw, fh]); }

  ["Apps, settings and files", "in one search.", "Then Pin to taskbar."].forEach((s, i) => text(s, 1550, 650 + i * 46, F(600, 32), i === 2 ? "#f0abfc" : "#d9d0ff", "left", ease((l - (i === 2 ? 2.8 : .9 + i * .15)) / .4)));

// 3b. The key highlights: six cards, one landing on each beat
const KEYS = [
  ["Free, forever", "No license. No subscription.", '<path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>', "#22c55e"],

  ["Your real apps", "Netflix, Spotify, Discord, Steam.", '<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>', "#f472b6"],
  ["Updates itself", "Tonight, in 30 minutes, or never.", '<path d="M20 11a8 8 0 0 0-14.6-4.5L3 9"/><path d="M3 3v6h6"/><path d="M4 13a8 8 0 0 0 14.6 4.5L21 15"/><path d="M21 21v-6h-6"/>', "#fbbf24"],

function sKeys(l, d, t) {
  bg(t, .85);
  kicker("The highlights", W / 2, 120, ease(l / .3), "center");
  headline([{ s: "Why people" }, { s: "switch.", g: true }], l - .05, 205, 84);
  const cw = 520, ch = 300, gap = 36, X0 = (W - (cw * 3 + gap * 2)) / 2, Y0 = 310;

    const v = (l - .5 - i * BEAT) / .35; if (v <= 0) return; const u = back(v), a = ease(v);

    const g = x.createLinearGradient(0, 0, cw, ch); g.addColorStop(0, "rgba(255,255,255,.08)"); g.addColorStop(1, "rgba(255,255,255,.01)"); x.fillStyle = g; x.fill();

    x.restore();

}
// 4. The highlights: three beats each, zoomed in, with a spotlight on the feature and its name
// [picture, kicker, title, line, spotlight (x0, y0, x1, y1 as fractions of the picture), zoom center, zoom]
const HIGHLIGHTS = [
  ["desks", "New in 3.2", "Virtual desktops", "One for school, one for games. Drag windows between them.", [.27, .77, .73, .93], .5, .8, 1.5],
  ["clip", "New in 3.2", "Clipboard history", "Nebulux + V: everything you copied, one click to paste.", [.726, .5, .992, .92], .82, .68, 1.45],

  ["tabs", "New in 3.2", "Tabs in File Explorer", "Ctrl + T for a new tab. Pin folders to Quick access.", [.115, .1, .37, .15], .3, .2, 1.9],

function sHighlights(l, d, t) {
