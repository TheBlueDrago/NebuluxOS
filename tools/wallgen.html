<!doctype html>
<meta charset="utf-8">
<title>Nebulux OS wallpaper painter</title>
<body style="margin:0;background:#000">
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Paints the newer Nebulux OS wallpapers (img/wall-6.jpg and on). Every picture is drawn by code with a fixed seed,
// so it comes out the same each time. tools/wallgen.cjs opens this page and saves window.paint(i) as a JPEG.
"use strict";
const W = 1920, H = 1080, cv = document.getElementById("c"), x = cv.getContext("2d");
const rng = (seed) => () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
function sky(stops) { const g = x.createLinearGradient(0, 0, 0, H); stops.forEach(([o, c]) => g.addColorStop(o, c)); x.fillStyle = g; x.fillRect(0, 0, W, H); }

// Nebulux Horizon (4.4): the edge of a giant planet under a violet nebula, its air glowing in Nebulux colors.
// One picture for each time of day (13 sunrise, 14 day, 15 dusk, 16 night): the dynamic background switches between them.
const HZ = {
  rise: { sky: [[0, "#03020b"], [.45, "#080520"], [1, "#0c0726"]], neb: 1, stars: 520, starB: .9, air: ["56,189,248", "167,139,250", "236,72,153", "99,102,241"], airA: 1, body: ["#1b1446", "#0a0720", "#05040f"], rim: "167,139,250", line: ["255,255,255", "240,171,252", "186,230,253"], sun: { a: .19, up: 0, cols: ["167,139,250", "240,171,252", "255,240,255"], size: 1 }, vig: .45 },
  day: { sky: [[0, "#060c2c"], [.5, "#102463"], [1, "#1d3f99"]], neb: .5, stars: 160, starB: .55, air: ["125,211,252", "147,197,253", "196,181,253", "56,189,248"], airA: 1.5, body: ["#2a3f8f", "#13235a", "#070d2a"], rim: "147,197,253", line: ["255,255,255", "186,230,253", "224,242,254"], sun: { a: .08, up: 230, cols: ["191,219,254", "224,242,254", "255,255,255"], size: 1.25 }, vig: .3 },
  dusk: { sky: [[0, "#0a0413"], [.5, "#2a0b2e"], [1, "#4a1430"]], neb: .85, stars: 360, starB: .8, air: ["251,146,60", "244,114,182", "217,70,239", "249,115,22"], airA: 1.2, body: ["#3a1236", "#1a0820", "#08030c"], rim: "251,146,60", line: ["255,237,213", "251,191,36", "244,114,182"], sun: { a: -.24, up: -14, cols: ["249,115,22", "251,146,60", "255,237,213"], size: .9 }, vig: .45 },
  night: { sky: [[0, "#020108"], [.5, "#050314"], [1, "#07051a"]], neb: 1.15, stars: 760, starB: 1, air: ["79,70,229", "99,102,241", "124,58,237", "56,189,248"], airA: .45, body: ["#0d0b26", "#06051a", "#030208"], rim: "99,102,241", line: ["165,180,252", "129,140,248", "125,211,252"], sun: null, vig: .55 },
};
function horizon(T) {
  const r = rng(4313);

  const cloud = (X, Y, R, col, a) => { const g = n.createRadialGradient(X, Y, 0, X, Y, R); g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(1, `rgba(${col},0)`); n.fillStyle = g; n.fillRect(X - R, Y - R, R * 2, R * 2); };
  const COLS = ["124,92,255", "168,85,247", "236,72,153", "56,189,248", "99,102,241"];
  for (let k = 0; k < 420; k++) {
    const t = r(), bx = W * (.05 + t * .95), by = H * (.12 + t * .32) + (r() - .5) * H * .32 * (1 - Math.abs(t - .5));
    cloud(bx, by, 40 + r() ** 2 * 260, COLS[(r() * COLS.length) | 0], (.025 + r() * .05) * T.neb);
  }
  for (let k = 0; k < 60; k++) cloud(W * r(), H * r() * .7, 300 + r() * 400, COLS[(r() * COLS.length) | 0], .02 * T.neb);
  // fine wisps, so the nebula has texture and isn't only soft blobs
  const F = document.createElement("canvas"); F.width = W; F.height = H; const fq = F.getContext("2d"); fq.globalCompositeOperation = "lighter";
  for (let k = 0; k < 1400; k++) { const t = r(), X = W * (.02 + t * .98), Y = H * (.12 + t * .32) + (r() - .5) * H * .28 * (1 - Math.abs(t - .5)), RR = 6 + r() ** 2 * 40, g = fq.createRadialGradient(X, Y, 0, X, Y, RR), c = COLS[(r() * COLS.length) | 0]; g.addColorStop(0, `rgba(${c},${(.05 + r() * .06) * T.neb})`); g.addColorStop(1, `rgba(${c},0)`); fq.fillStyle = g; fq.fillRect(X - RR, Y - RR, RR * 2, RR * 2); }
  x.filter = "blur(18px)"; x.drawImage(N, 0, 0); x.filter = "blur(2px)"; x.globalAlpha = .45; x.globalCompositeOperation = "lighter"; x.drawImage(N, 0, 0); x.globalAlpha = .9; x.filter = "blur(1.5px)"; x.drawImage(F, 0, 0); x.globalAlpha = 1; x.filter = "none"; x.globalCompositeOperation = "source-over";
  // dark dust lanes through the nebula
  for (let k = 0; k < 16; k++) { const t = r(), X = W * t, Y = H * (.15 + t * .3) + (r() - .5) * 120, R = 140 + r() * 220; const g = x.createRadialGradient(X, Y, 0, X, Y, R); g.addColorStop(0, "rgba(3,2,11,.2)"); g.addColorStop(1, "rgba(3,2,11,0)"); x.fillStyle = g; x.fillRect(X - R, Y - R, R * 2, R * 2); }
  stars(T.stars, r, H * .8, T.starB);
  for (let k = 0; k < 14; k++) { const sx = r() * W, sy = r() * H * .65; glow(sx, sy, 12, "220,210,255", .45 * T.starB); x.fillStyle = `rgba(255,255,255,${T.starB})`; x.beginPath(); x.arc(sx, sy, 1.8, 0, 7); x.fill(); }
  // the planet: a huge dark ball whose top edge lights up

  const halo = (w, a, blur) => { a *= A; x.save(); x.filter = `blur(${blur}px)`; x.globalCompositeOperation = "lighter"; const cg = x.createConicGradient(-Math.PI / 2, PX, PY); cg.addColorStop(0, `rgba(${a1},${a})`); cg.addColorStop(.06, `rgba(${a2},${a})`); cg.addColorStop(.12, `rgba(${a3},${a * .7})`); cg.addColorStop(.2, `rgba(${a3},0)`); cg.addColorStop(.8, `rgba(${a1},0)`); cg.addColorStop(.92, `rgba(${a4},${a * .8})`); cg.addColorStop(1, `rgba(${a1},${a})`); x.strokeStyle = cg; x.lineWidth = w; x.beginPath(); x.arc(PX, PY, PR, 0, 7); x.stroke(); x.restore(); };
  halo(260, .16, 60); halo(90, .35, 26); halo(26, .6, 8);
  const body = x.createRadialGradient(PX + PR * .25, PY - PR * .9, PR * .2, PX, PY, PR); body.addColorStop(0, T.body[0]); body.addColorStop(.7, T.body[1]); body.addColorStop(1, T.body[2]);
  x.fillStyle = body; x.beginPath(); x.arc(PX, PY, PR, 0, 7); x.fill();

  x.save(); x.beginPath(); x.arc(PX, PY, PR, 0, 7); x.clip(); x.globalCompositeOperation = "lighter";
  for (let k = 0; k < 9; k++) { const rr = PR - 30 - k * 34 - r() * 20; x.strokeStyle = `rgba(${k % 2 ? a2 : a1},${.05 - k * .004})`; x.lineWidth = 10 + r() * 18; x.filter = "blur(10px)"; x.beginPath(); x.arc(PX, PY, rr, 0, 7); x.stroke(); }
  x.filter = "blur(24px)"; const rim = x.createLinearGradient(0, PY - PR, 0, PY - PR + 260); rim.addColorStop(0, `rgba(${T.rim},${.55 * Math.min(1, A)})`); rim.addColorStop(1, `rgba(${T.rim},0)`); x.fillStyle = rim; x.fillRect(0, PY - PR, W, 260);
  x.restore();
  const [l1, l2, l3] = T.line;
  x.save(); x.globalCompositeOperation = "lighter"; x.lineWidth = 2.2; const lc = x.createConicGradient(-Math.PI / 2, PX, PY); lc.addColorStop(0, `rgba(${l1},.95)`); lc.addColorStop(.1, `rgba(${l2},.8)`); lc.addColorStop(.17, `rgba(${l2},0)`); lc.addColorStop(.85, `rgba(${l3},0)`); lc.addColorStop(.95, `rgba(${l3},.85)`); lc.addColorStop(1, `rgba(${l1},.95)`); x.strokeStyle = lc; x.beginPath(); x.arc(PX, PY, PR, 0, 7); x.stroke(); x.restore();

  if (T.sun) {

    x.globalCompositeOperation = "lighter"; glow(SX, SY, 620 * z, s1, .22); glow(SX, SY, 260 * z, s2, .35); glow(SX, SY, 90 * z, s3, .8); glow(SX, SY, 26 * z, "255,255,255", 1);
    x.save(); x.translate(SX, SY); x.rotate(-.12); const fl = x.createLinearGradient(-900, 0, 900, 0); fl.addColorStop(0, `rgba(${s1},0)`); fl.addColorStop(.5, `rgba(${s3},.5)`); fl.addColorStop(1, `rgba(${s1},0)`); x.fillStyle = fl; x.filter = "blur(3px)"; x.fillRect(-900, -1.5, 1800, 3); x.restore();

}

const PAINT = [
  // 6. Silk Waves: ribbons of light flowing across a deep violet night
  () => {

    stars(260, r, H, .7);
    x.globalCompositeOperation = "lighter";
    for (let k = 0; k < 140; k++) {
      const t = k / 140, base = H * (.32 + .36 * t), amp = 120 + 90 * Math.sin(t * 5.3), ph = t * 2.4, fr = .0021 + .0006 * Math.sin(t * 3);
      const g = x.createLinearGradient(0, 0, W, 0); g.addColorStop(0, "rgba(34,211,238,0)"); g.addColorStop(.25, `rgba(34,211,238,${.09 + .05 * (1 - t)})`); g.addColorStop(.55, `rgba(167,139,250,${.17})`); g.addColorStop(.85, `rgba(244,114,182,${.1 + .05 * t})`); g.addColorStop(1, "rgba(244,114,182,0)");
      x.strokeStyle = g; x.lineWidth = 1.4 + (k % 9 === 0 ? 1.6 : 0); x.beginPath();

    x.globalCompositeOperation = "source-over"; x.filter = "blur(18px)"; x.globalAlpha = .55; x.drawImage(cv, 0, 0); x.filter = "none"; x.globalAlpha = 1;
    x.globalCompositeOperation = "lighter";
    for (let k = 0; k < 60; k++) { const t = k / 60, base = H * (.36 + .3 * t), amp = 130 + 80 * Math.sin(t * 5.3), ph = t * 2.4, fr = .0021 + .0006 * Math.sin(t * 3); x.strokeStyle = `rgba(255,240,255,${.05 + .04 * Math.sin(t * 9) ** 2})`; x.lineWidth = 1; x.beginPath(); for (let X = -20; X <= W + 20; X += 12) { const Y = base + Math.sin(X * fr + ph) * amp + Math.sin(X * fr * 2.7 + ph * 1.7) * amp * .22; X === -20 ? x.moveTo(X, Y) : x.lineTo(X, Y); } x.stroke(); }
    x.globalCompositeOperation = "source-over"; grain(r, 6);
  },
  // 7. Star Dunes: a ringed planet rising over glowing dunes
  () => {
    const r = rng(72);

    glow(W * .66, H * .5, 700, "244,114,182", .22); glow(W * .2, H * .3, 600, "99,102,241", .2);

    glow(px, py, pr * 2.4, "251,191,236", .25);
    const ring = (front) => { x.save(); x.translate(px, py); x.rotate(-.3); x.scale(1, .24); for (let i = 0; i < 4; i++) { const R = pr * (1.5 + i * .17); x.strokeStyle = `rgba(255,226,250,${(.5 - i * .1) * (front ? 1 : .55)})`; x.lineWidth = 16 - i * 3; x.beginPath(); front ? x.arc(0, 0, R, 0, Math.PI) : x.arc(0, 0, R, Math.PI, Math.PI * 2); x.stroke(); } x.restore(); };
    ring(false);
    const pg = x.createLinearGradient(px - pr, py - pr, px + pr, py + pr); pg.addColorStop(0, "#ffe4f3"); pg.addColorStop(.45, "#f0abfc"); pg.addColorStop(1, "#5b21b6");
    x.fillStyle = pg; x.beginPath(); x.arc(px, py, pr, 0, 7); x.fill();
    x.save(); x.beginPath(); x.arc(px, py, pr, 0, 7); x.clip(); x.filter = "blur(7px)";
    for (let i = 0; i < 11; i++) { x.fillStyle = `rgba(${i % 2 ? "255,240,252" : "109,40,217"},${.12 + .06 * Math.sin(i * 1.7) ** 2})`; const yy = py - pr + i * 40 + 6; x.beginPath(); x.ellipse(px, yy, pr * 1.2, 9 + (i % 3) * 5, 0, 0, 7); x.fill(); }
    x.filter = "none"; const sh = x.createRadialGradient(px - pr * .45, py - pr * .45, pr * .15, px, py, pr * 1.05); sh.addColorStop(0, "rgba(255,255,255,.18)"); sh.addColorStop(.6, "rgba(0,0,0,0)"); sh.addColorStop(1, "rgba(25,6,50,.6)"); x.fillStyle = sh; x.fillRect(px - pr, py - pr, pr * 2, pr * 2); x.restore();

    for (const [h0, c0, c1, s] of dunes) {

        const g = lx.createLinearGradient(0, Y - hh, 0, Y + 24); g.addColorStop(0, `rgba(${col2},0)`); g.addColorStop(.5, `rgba(${col2},${.05 * a * ray})`); g.addColorStop(.9, `rgba(${col1},${.2 * a * ray})`); g.addColorStop(1, `rgba(${col1},0)`);

      const g = x.createRadialGradient(X - R * .3, Y - R * .35, R * .1, X, Y, R); g.addColorStop(0, `rgba(255,255,255,.55)`); g.addColorStop(.6, `rgba(${c},.22)`); g.addColorStop(1, `rgba(${c},.05)`);
